[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-accountdeck"
dynamic = ["version"]
description = "A terminal dashboard for Codex accounts, quotas, reset credits and thread names"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["codex", "tui", "accounts", "quotas", "terminal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console :: Curses",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = []

[project.scripts]
codex-accountdeck = "codex_hub:main"

[project.urls]
Repository = "https://github.com/nerdworldDE/codex-accountdeck"
Issues = "https://github.com/nerdworldDE/codex-accountdeck/issues"

[tool.setuptools]
py-modules = ["codex_hub", "hub_accounts", "codex_resets", "codex_renamer", "codex_colors"]

[tool.setuptools.dynamic]
version = {attr = "codex_hub.VERSION"}
